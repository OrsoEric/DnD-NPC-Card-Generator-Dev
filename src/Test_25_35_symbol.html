<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>63.5 × 88.9 mm Square with SVG and 42</title>
<style>
  .square{
    width: 63.5mm;          /* 63.5 mm wide */
    height: 88.9mm;         /* 88.9 mm tall */
    border: 1px solid #000;
    position: relative;     /* for absolutely‑positioned children */
    box-sizing: border-box;
  }
  .icon{
    width:10%;              /* 10 % of the square’s width */
    height:auto;            /* keep aspect ratio of SVG */
    position:absolute;
    right:0; bottom:0;      /* bottom‑right corner */
    display:block;
  }
  .number{
    position:absolute;
    right:5px; bottom:5px;   /* slightly inset from the icon edge */
    font-size:1.2rem;
    font-weight:bold;
    color:#000;
    text-shadow:1px 1px 0 #fff;
    pointer-events:none;    /* let clicks pass through to SVG if needed */
  }
</style>
</head>
<body>

<div class="square">
  <img src="/svg/shield.svg" alt="Symbol" class="icon">
  <div class="number">42</div>
</div>

</body>
</html>
